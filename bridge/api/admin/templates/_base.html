<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>{% block title %}DramaBiliki Admin{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root { --brand: #ff2e55; --brand2: #ff7a45; --bg: #07080a; --surface: #121418; --border: #24272e; --muted: #8b919c; }
        body { background: var(--bg); color: #e6e8eb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .navbar { background: rgba(7, 8, 10, .92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
        .brand-icon { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--brand), var(--brand2)); display: inline-flex; align-items: center; justify-content: center; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; }
        .table { --bs-table-bg: transparent; color: #d4d8de; border-color: var(--border); margin-bottom: 0; }
        .table thead th { color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; border-bottom-color: var(--border); }
        .btn-brand { background: linear-gradient(90deg, var(--brand), var(--brand2)); border: 0; color: #fff; font-weight: 600; }
        .btn-brand:hover { filter: brightness(1.08); color: #fff; }
        .form-control, .form-select { background-color: #1d2026; border-color: #2a2e36; }
        .nav-main .nav-link { color: var(--muted); font-weight: 600; border-radius: 10px; padding: .35rem .75rem; }
        .nav-main .nav-link.active, .nav-main .nav-link:hover { color: #fff; background: #1d2026; }
        .cover-thumb { width: 42px; height: 56px; object-fit: cover; border-radius: 6px; background: #1d2026; }
        code { color: #ff8aa0; }
        {% block style %}{% endblock %}
    </style>
</head>
<body>
<nav class="navbar sticky-top px-3 px-md-4 mb-4">
    <div class="container-fluid px-0 gap-2">
        <a class="navbar-brand fw-bold d-flex align-items-center gap-2 text-white" href="/admin">
            <span class="brand-icon"><i class="bi bi-play-fill text-white"></i></span>
            <span class="d-none d-sm-inline">DramaBiliki <span class="text-secondary fw-normal">Admin</span></span>
        </a>
        <div class="nav nav-main flex-nowrap overflow-auto me-auto">
            <a class="nav-link {{ 'active' if active == 'dashboard' }}" href="/admin"><i class="bi bi-speedometer2"></i> Tableau de bord</a>
            <a class="nav-link {{ 'active' if active == 'upload' }}" href="/admin/upload"><i class="bi bi-cloud-arrow-up"></i> Téléverser</a>
            <a class="nav-link {{ 'active' if active == 'users' }}" href="/admin/users"><i class="bi bi-people"></i> Utilisateurs</a>
            <a class="nav-link {{ 'active' if active == 'app' }}" href="/admin/app"><i class="bi bi-phone"></i> Application</a>
        </div>
        <form method="post" action="/admin/logout" class="m-0">
            <button class="btn btn-sm btn-outline-light" title="Déconnexion"><i class="bi bi-box-arrow-right"></i></button>
        </form>
    </div>
</nav>
<div class="container-fluid px-3 px-md-4 pb-5">
    {% if msg %}
    <div class="alert alert-{{ level }} alert-dismissible fade show py-2" role="alert">
        {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endif %}
    {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
