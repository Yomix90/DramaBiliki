# Works locally (`docker compose up -d`) and as a Dokploy "Docker Compose" service.
# In Dokploy, set the variables below in the Environment tab and attach your domain
# to the "bridge" service on port 8090 (Domains tab): Traefik handles HTTPS.
# The port is also published on the host (http://<vps-ip>:8090) for direct access.

services:
  bridge:
    build: .
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      APP_ENV: production
      PORT: "8090"
      # Required: long random strings (e.g. `openssl rand -hex 32`)
      SECRET_KEY: ${SECRET_KEY:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      # Admin panel stays locked until this is set (the API works without it)
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Public HTTPS URL of the bridge, e.g. https://api.dramabiliki.com
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Telegram source (can also be set in Admin → Telegram)
      TG_API_ID: ${TG_API_ID:-}
      TG_API_HASH: ${TG_API_HASH:-}
      TG_SYNC_INTERVAL_MINUTES: ${TG_SYNC_INTERVAL_MINUTES:-10}
      TG_CACHE_VIDEOS: ${TG_CACHE_VIDEOS:-false}
      LEGACY_SOURCE_ENABLED: ${LEGACY_SOURCE_ENABLED:-false}
      SOURCE_BASE_URL: ${SOURCE_BASE_URL:-https://dramadunyam.com}
      SOURCE_CDN_PRIMARY: ${SOURCE_CDN_PRIMARY:-cdn2.dramaflix.net}
      SOURCE_CDN_FAILOVER: ${SOURCE_CDN_FAILOVER:-cdn.dramaflix.net}
      # Proxy for source requests when the VPS IP gets HTTP 403 from Cloudflare
      SOURCE_PROXY: ${SOURCE_PROXY:-}
      STREAM_CACHE_TTL_SECONDS: ${STREAM_CACHE_TTL_SECONDS:-600}
      PROXY_SEGMENTS: ${PROXY_SEGMENTS:-false}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      LIGHT_SYNC_INTERVAL_MINUTES: ${LIGHT_SYNC_INTERVAL_MINUTES:-30}
      FULL_SYNC_HOUR_UTC: ${FULL_SYNC_HOUR_UTC:-3}
      SCANNER_MAX_CONCURRENT_REQUESTS: ${SCANNER_MAX_CONCURRENT_REQUESTS:-2}
    volumes:
      - bridge_data:/app/data
      - bridge_media:/app/media

volumes:
  bridge_data:
  bridge_media:
